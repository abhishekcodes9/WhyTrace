<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Cinematic detective office at night: walnut desk, brass lamps, corkboard with red threads, and a rain-streaked city window">
  <defs>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4cd85" stop-opacity=".92"/>
      <stop offset="18%" stop-color="#c49a58" stop-opacity=".55"/>
      <stop offset="52%" stop-color="#8a5b2c" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#17120f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9a0" stop-opacity=".55"/>
      <stop offset="35%" stop-color="#c49a58" stop-opacity=".24"/>
      <stop offset="100%" stop-color="#17120f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d5132" stop-opacity=".4"/>
      <stop offset="52%" stop-color="#28353c" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#121b21" stop-opacity=".92"/>
    </linearGradient>
    <linearGradient id="deskWood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3f2b1d"/>
      <stop offset="48%" stop-color="#2a1d14"/>
      <stop offset="100%" stop-color="#1a120d"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241b16"/>
      <stop offset="100%" stop-color="#100c0a"/>
    </linearGradient>
    <linearGradient id="rain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d7c8ad" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#d7c8ad" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc5"/>
      <stop offset="100%" stop-color="#bfae8e"/>
    </linearGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="smallGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".09"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="overlay"/>
    </filter>
    <filter id="blurBg"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="windowClip"><rect x="876" y="92" width="590" height="520" rx="3"/></clipPath>
    <pattern id="rainPattern" width="46" height="84" patternUnits="userSpaceOnUse">
      <line x1="8" y1="0" x2="1" y2="42" stroke="#cfc3ae" stroke-opacity=".18" stroke-width="1"/>
      <line x1="31" y1="12" x2="24" y2="58" stroke="#cfc3ae" stroke-opacity=".12" stroke-width="1"/>
      <line x1="43" y1="48" x2="38" y2="82" stroke="#e8dcc5" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <pattern id="cork" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#3b2a1d"/>
      <circle cx="4" cy="6" r="1" fill="#5d422c" opacity=".55"/>
      <circle cx="17" cy="14" r=".8" fill="#20150e" opacity=".6"/>
      <circle cx="10" cy="21" r="1.2" fill="#6b4d34" opacity=".4"/>
      <circle cx="23" cy="3" r=".7" fill="#1b120c" opacity=".5"/>
    </pattern>
  </defs>

  <!-- room -->
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <path d="M0 640 L1600 610 L1600 1000 L0 1000 Z" fill="#1a120d"/>
  <!-- wall panelling -->
  <g opacity=".38">
    <path d="M0 520 H1600" stroke="#3f2f25" stroke-width="2"/>
    <path d="M0 590 H1600" stroke="#3f2f25" stroke-width="1"/>
    <path d="M120 430 V660 M260 430 V660 M1530 420 V660" stroke="#2e2018" stroke-width="2"/>
  </g>

  <!-- rainy city window -->
  <g>
    <rect x="856" y="72" width="630" height="560" rx="6" fill="#0f0c0a" stroke="#4a3524" stroke-width="18"/>
    <rect x="876" y="92" width="590" height="520" rx="3" fill="url(#windowGlow)"/>
    <g clip-path="url(#windowClip)">
      <!-- distant buildings -->
      <g fill="#0c1519" opacity=".9">
        <rect x="890" y="300" width="90" height="330"/>
        <rect x="995" y="248" width="72" height="382"/>
        <rect x="1082" y="330" width="110" height="300"/>
        <rect x="1205" y="282" width="64" height="348"/>
        <rect x="1284" y="356" width="120" height="274"/>
        <rect x="1410" y="306" width="70" height="324"/>
      </g>
      <!-- city windows -->
      <g fill="#c49a58" opacity=".55">
        <rect x="904" y="322" width="9" height="7"/><rect x="925" y="340" width="9" height="7"/>
        <rect x="951" y="366" width="9" height="7"/><rect x="906" y="404" width="9" height="7"/>
        <rect x="1012" y="280" width="8" height="6"/><rect x="1032" y="316" width="8" height="6"/>
        <rect x="1046" y="365" width="8" height="6"/><rect x="1014" y="420" width="8" height="6"/>
        <rect x="1104" y="352" width="10" height="7"/><rect x="1138" y="382" width="10" height="7"/>
        <rect x="1166" y="340" width="10" height="7"/><rect x="1119" y="432" width="10" height="7"/>
        <rect x="1218" y="314" width="8" height="6"/><rect x="1240" y="356" width="8" height="6"/>
        <rect x="1304" y="388" width="9" height="7"/><rect x="1346" y="418" width="9" height="7"/>
        <rect x="1368" y="368" width="9" height="7"/><rect x="1422" y="334" width="8" height="6"/>
        <rect x="1446" y="376" width="8" height="6"/><rect x="987" y="460" width="8" height="6"/>
      </g>
      <!-- wet glow -->
      <ellipse cx="1160" cy="560" rx="390" ry="80" fill="#c49a58" opacity=".08"/>
      <rect x="876" y="92" width="590" height="520" fill="url(#rainPattern)"/>
      <g stroke="url(#rain)" stroke-width="1.3" opacity=".65">
        <path d="M930 105 l-12 88"/><path d="M1002 140 l-10 74"/><path d="M1084 102 l-14 110"/>
        <path d="M1176 150 l-11 92"/><path d="M1250 118 l-16 122"/><path d="M1322 160 l-10 78"/>
        <path d="M1398 110 l-13 104"/><path d="M1444 200 l-10 70"/><path d="M964 330 l-10 74"/>
        <path d="M1128 296 l-13 100"/><path d="M1298 340 l-12 94"/><path d="M1410 300 l-10 86"/>
      </g>
      <!-- window glints -->
      <g fill="#f3ebdd" opacity=".45">
        <circle cx="1008" cy="182" r="1.4"/><circle cx="1168" cy="228" r="1.1"/>
        <circle cx="1324" cy="176" r="1.6"/><circle cx="1390" cy="264" r="1.1"/>
      </g>
    </g>
    <!-- window mullions -->
    <path d="M1170 92 V612 M876 352 H1466" stroke="#3b2a1e" stroke-width="10"/>
    <path d="M1180 92 V612 M876 346 H1466" stroke="#6c4f32" stroke-width="1.5" opacity=".5"/>
    <!-- sill -->
    <rect x="840" y="620" width="666" height="24" rx="4" fill="#4a3524"/>
    <rect x="840" y="620" width="666" height="3" fill="#7b5b38" opacity=".55"/>
  </g>

  <!-- evidence corkboard -->
  <g transform="translate(70 110)">
    <rect width="640" height="410" rx="6" fill="#1a120d" stroke="#5a4028" stroke-width="20"/>
    <rect x="16" y="16" width="608" height="378" fill="url(#cork)"/>
    <!-- pinned papers -->
    <g filter="url(#blurBg)" opacity=".9">
      <g transform="translate(52 56) rotate(-3)">
        <rect width="150" height="194" fill="url(#paperGrad)" rx="2"/>
        <rect x="14" y="18" width="112" height="7" fill="#6f6048" opacity=".55"/>
        <g fill="#8d7c5f" opacity=".5">
          <rect x="14" y="42" width="122" height="4"/><rect x="14" y="54" width="102" height="4"/>
          <rect x="14" y="66" width="118" height="4"/><rect x="14" y="78" width="85" height="4"/>
          <rect x="14" y="100" width="110" height="4"/><rect x="14" y="112" width="94" height="4"/>
          <rect x="14" y="124" width="120" height="4"/><rect x="14" y="136" width="70" height="4"/>
        </g>
      </g>
      <g transform="translate(248 34) rotate(2.4)">
        <rect width="168" height="176" fill="#d9c9ab" rx="2"/>
        <rect x="15" y="16" width="100" height="8" fill="#6f6048" opacity=".55"/>
        <g fill="#8d7c5f" opacity=".45">
          <rect x="15" y="42" width="135" height="4"/><rect x="15" y="55" width="110" height="4"/>
          <rect x="15" y="68" width="128" height="4"/><rect x="15" y="81" width="84" height="4"/>
          <rect x="15" y="104" width="132" height="4"/><rect x="15" y="117" width="100" height="4"/>
        </g>
      </g>
      <g transform="translate(448 82) rotate(-1.6)">
        <rect width="136" height="166" fill="#efe4ce" rx="2"/>
        <rect x="14" y="16" width="86" height="7" fill="#6f6048" opacity=".55"/>
        <g fill="#8d7c5f" opacity=".45">
          <rect x="14" y="40" width="106" height="4"/><rect x="14" y="53" width="90" height="4"/>
          <rect x="14" y="66" width="104" height="4"/><rect x="14" y="79" width="64" height="4"/>
          <rect x="14" y="100" width="100" height="4"/><rect x="14" y="113" width="78" height="4"/>
        </g>
      </g>
      <g transform="translate(286 246) rotate(1.2)">
        <rect width="190" height="108" fill="#e2d4b8" rx="2"/>
        <rect x="14" y="14" width="96" height="7" fill="#6f6048" opacity=".55"/>
        <g fill="#8d7c5f" opacity=".45">
          <rect x="14" y="38" width="150" height="4"/><rect x="14" y="51" width="128" height="4"/>
          <rect x="14" y="64" width="140" height="4"/><rect x="14" y="77" width="92" height="4"/>
        </g>
      </g>
      <g transform="translate(92 286) rotate(-2.2)">
        <rect width="150" height="82" fill="#d6c5a4" rx="2"/>
        <rect x="12" y="13" width="80" height="6" fill="#6f6048" opacity=".55"/>
        <g fill="#8d7c5f" opacity=".45">
          <rect x="12" y="34" width="118" height="4"/><rect x="12" y="47" width="96" height="4"/>
          <rect x="12" y="60" width="108" height="4"/>
        </g>
      </g>
    </g>
    <!-- red threads -->
    <g stroke="#8e3830" fill="none" stroke-width="2.4" stroke-linecap="round" opacity=".95">
      <path d="M116 66 Q 250 124 322 64"/>
      <path d="M322 64 Q 430 122 516 96"/>
      <path d="M322 64 Q 344 196 372 260"/>
      <path d="M116 66 Q 142 206 162 300"/>
      <path d="M516 96 Q 520 200 470 300"/>
      <path d="M162 300 Q 260 330 372 260"/>
      <path d="M372 260 Q 420 316 470 300"/>
      <path d="M162 300 Q 214 340 262 286"/>
    </g>
    <!-- brass pins -->
    <g>
      <circle cx="116" cy="66" r="5" fill="#e3bb78" stroke="#4a331c" stroke-width="1.5"/>
      <circle cx="322" cy="64" r="5" fill="#e3bb78" stroke="#4a331c" stroke-width="1.5"/>
      <circle cx="516" cy="96" r="5" fill="#e3bb78" stroke="#4a331c" stroke-width="1.5"/>
      <circle cx="162" cy="300" r="5" fill="#e3bb78" stroke="#4a331c" stroke-width="1.5"/>
      <circle cx="372" cy="260" r="5" fill="#e3bb78" stroke="#4a331c" stroke-width="1.5"/>
      <circle cx="470" cy="300" r="5" fill="#e3bb78" stroke="#4a331c" stroke-width="1.5"/>
      <circle cx="262" cy="286" r="5" fill="#e3bb78" stroke="#4a331c" stroke-width="1.5"/>
    </g>
    <!-- board shadow -->
    <rect x="10" y="14" width="620" height="396" fill="#000" opacity=".18" filter="url(#softGlow)" transform="translate(8 14)"/>
  </g>

  <!-- lamp glow behind desk -->
  <ellipse cx="1180" cy="620" rx="380" ry="240" fill="url(#lampGlow)" opacity=".55"/>
  <ellipse cx="240" cy="590" rx="280" ry="210" fill="url(#lampGlow2)" opacity=".45"/>

  <!-- desk -->
  <path d="M0 720 Q 340 660 790 686 T1600 700 V1000 H0 Z" fill="url(#deskWood)"/>
  <path d="M0 720 Q 340 660 790 686 T1600 700" stroke="#79532f" stroke-width="3" opacity=".45"/>
  <g opacity=".24" stroke="#0c0806" stroke-width="1">
    <path d="M0 790 Q 420 756 820 776 T1600 780"/>
    <path d="M0 882 Q 430 842 880 868 T1600 856"/>
    <path d="M300 728 Q 354 840 338 1000"/>
    <path d="M1080 714 Q 1040 850 1074 1000"/>
  </g>

  <!-- left banker's lamp -->
  <g transform="translate(250 470)">
    <ellipse cx="0" cy="230" rx="185" ry="32" fill="#080604" opacity=".55"/>
    <rect x="-9" y="108" width="18" height="126" rx="4" fill="#7b5a2c"/>
    <rect x="-13" y="224" width="26" height="13" rx="3" fill="#b58a4c"/>
    <ellipse cx="0" cy="236" rx="58" ry="12" fill="#4c351e"/>
    <path d="M-10 108 Q 0 88 10 108 L16 112 Q 0 122 -16 112 Z" fill="#c49a58"/>
    <!-- shade -->
    <path d="M-92 40 Q 0 -8 92 40 L78 84 Q 0 58 -78 84 Z" fill="#2a3a2c" stroke="#7f6a3d" stroke-width="2"/>
    <path d="M-87 44 Q 0 0 87 44" stroke="#c9a86a" stroke-width="2" fill="none" opacity=".7"/>
    <ellipse cx="0" cy="82" rx="75" ry="13" fill="#f1cd8c" opacity=".85"/>
    <ellipse cx="0" cy="88" rx="108" ry="32" fill="#c49a58" opacity=".22" filter="url(#softGlow)"/>
    <ellipse cx="0" cy="96" rx="120" ry="30" fill="url(#lampGlow)" opacity=".55"/>
  </g>

  <!-- right desk lamp / brass -->
  <g transform="translate(1382 492)">
    <ellipse cx="0" cy="212" rx="160" ry="26" fill="#080604" opacity=".5"/>
    <path d="M0 118 C -6 150 22 172 6 208" stroke="#b58a4c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="4" cy="212" rx="48" ry="10" fill="#5a3d22"/>
    <path d="M-46 72 Q 0 30 46 72 L36 118 Q 0 100 -36 118 Z" fill="#2c3b2e" stroke="#8d7548" stroke-width="2"/>
    <ellipse cx="0" cy="116" rx="34" ry="7" fill="#f4d59b" opacity=".9"/>
    <ellipse cx="0" cy="140" rx="92" ry="36" fill="#c49a58" opacity=".2" filter="url(#softGlow)"/>
    <ellipse cx="0" cy="156" rx="106" ry="36" fill="url(#lampGlow)" opacity=".6"/>
  </g>

  <!-- desk papers and dossier -->
  <g transform="translate(660 742) rotate(-5)">
    <rect x="6" y="9" width="368" height="214" fill="#080604" opacity=".4" filter="url(#softGlow)"/>
    <rect width="368" height="214" fill="#cdbc9d" rx="2"/>
    <rect x="18" y="17" width="332" height="180" fill="#e8dcc5" rx="1"/>
    <rect x="40" y="36" width="158" height="10" fill="#6f6048" opacity=".55"/>
    <g fill="#8d7c5f" opacity=".5">
      <rect x="40" y="62" width="280" height="4"/><rect x="40" y="75" width="260" height="4"/>
      <rect x="40" y="88" width="286" height="4"/><rect x="40" y="101" width="212" height="4"/>
      <rect x="40" y="124" width="270" height="4"/><rect x="40" y="137" width="236" height="4"/>
      <rect x="40" y="150" width="190" height="4"/>
    </g>
    <rect x="286" y="160" width="34" height="8" fill="#8e3830" opacity=".7"/>
  </g>
  <!-- folded file -->
  <g transform="translate(1010 780) rotate(4)">
    <rect width="250" height="150" fill="#b9a483" rx="2"/>
    <rect x="12" y="12" width="226" height="126" fill="#d9c9ab" rx="1"/>
    <rect x="30" y="28" width="110" height="8" fill="#6f6048" opacity=".55"/>
    <g fill="#8d7c5f" opacity=".45">
      <rect x="30" y="50" width="188" height="4"/><rect x="30" y="63" width="164" height="4"/>
      <rect x="30" y="76" width="176" height="4"/><rect x="30" y="99" width="120" height="4"/>
    </g>
  </g>

  <!-- magnifying glass -->
  <g transform="translate(520 770) rotate(20)">
    <circle cx="0" cy="0" r="64" fill="#0f0b08" opacity=".35"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="#c49a58" stroke-width="7"/>
    <circle cx="0" cy="0" r="58" fill="#c49a58" opacity=".05"/>
    <circle cx="0" cy="0" r="51" fill="none" stroke="#f0d19a" stroke-width="1" opacity=".4"/>
    <path d="M-26 -18 Q -8 -44 24 -40" stroke="#f3ebdd" stroke-width="3" opacity=".25" fill="none" stroke-linecap="round"/>
    <path d="M42 42 L 96 96" stroke="#a87f45" stroke-width="12" stroke-linecap="round"/>
    <path d="M42 42 L 96 96" stroke="#e0b876" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(1300 800)">
    <ellipse cx="0" cy="54" rx="38" ry="10" fill="#080604" opacity=".5"/>
    <path d="M-32 0 L-26 54 Q 0 66 26 54 L32 0 Z" fill="#2b1c13" stroke="#5a4028" stroke-width="2"/>
    <ellipse cx="0" cy="0" rx="32" ry="9" fill="#1a120d"/>
    <ellipse cx="0" cy="0" rx="25" ry="6" fill="#3d2617"/>
    <path d="M24 10 Q 48 14 40 32 Q 34 44 22 38" stroke="#5a4028" stroke-width="6" fill="none"/>
    <g stroke="#d9c9ab" stroke-width="2" fill="none" opacity=".15">
      <path d="M-12 -12 Q -20 -28 -8 -40"/><path d="M4 -10 Q -2 -26 8 -42"/>
    </g>
  </g>

  <!-- foreground vignette -->
  <rect width="1600" height="1000" fill="url(#lampGlow)" opacity=".05"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity=".5"/>
  <path d="M0 0 H1600 V1000 H0 Z" fill="none" stroke="#000" stroke-width="60" opacity=".22"/>
</svg>
